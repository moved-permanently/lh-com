<div class="flashteasercore section"><div class="dcep-flash-teaser" data-dcep="{&quot;id&quot;: &quot;a784a8afd-3210-47e0-ad1c-e96ac737eb05&quot;, &quot;flashTeaserMessages&quot;:[{&quot;type&quot;:&quot;irreg&quot;,&quot;criticality&quot;:&quot;high&quot;,&quot;activationTime&quot;:1792762284235,&quot;headline&quot;:&quot;Information über den Flugverkehr nach Dubai   &quot;,&quot;messageDetails&quot;:&quot;&lt;p&gt;Angesichts der aktuellen Lage und des Lageausblicks im Nahen Osten hat die Lufthansa Group heute entschieden, ihre geplante Wiederaufnahme der Flüge nach Dubai (Vereinigte Arabische Emirate) auf den 25. November 2026 zu verschieben. Ursprünglich war der Start der Verbindungen von Lufthansa und SWISS zum 25. Oktober, beziehungsweise für Eurowings zum 1. November, geplant. Fluggäste, die Dubai-Flüge bis zum 25. November gebucht haben, werden entsprechend umgebucht und darüber informiert.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Flug von einer Unregelmässigkeit betroffen?&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;Bitte informieren Sie sich &lt;a href=\&quot;https://www.lufthansa.com/de/de/flugplan-und-flugstatus#/\&quot;&gt;&lt;b&gt;hier&lt;/b&gt;&lt;/a&gt; über den aktuellen Status Ihres Fluges bevor Sie zum Flughafen fahren.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Kontaktdaten hinterlegen, damit wir Ihnen wichtige Informationen zu Ihrem Flug schnell zukommen lassen können&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;Bitte geben Sie Ihre Kontaktdaten unter &lt;a href=\&quot;https://www.lufthansa.com/de/de/anmeldung?deeplinkRedirect=true\&quot;&gt;&lt;b&gt;Meine Buchungen&lt;/b&gt;&lt;/a&gt; an oder erstellen Sie sich Ihre persönliche Travel ID. Nur so ist sichergestellt, dass wir Sie bei Bedarf während Ihrer Reise kontaktieren können.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Umbuchung und weitere Optionen&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;Im Falle einer Annullierung werden Sie von Lufthansa kostenlos und in der Regel automatisch auf einen anderen Flug umgebucht und über Ihre Mobilfunknummer informiert. Sollten Sie keine Nachricht von Lufthansa bekommen, schauen Sie bitte in den aktuellen Stand &lt;a href=\&quot;https://www.lufthansa.com/de/de/anmeldung?deeplinkRedirect=true\&quot;&gt;&lt;b&gt;Ihrer Buchung&lt;/b&gt;&lt;/a&gt;. Hier können Sie sich selbst zu einem späteren Zeitpunkt umbuchen oder sich das Ticket rückerstatten lassen. Alternativ steht Ihnen auch der&amp;nbsp; &lt;a href=\&quot;https://www.lufthansa.com/digitalassistant/webchat.html?ref=flightdisruption&amp;amp;start=irreg\&quot;&gt;&lt;b&gt;Lufthansa Chat Assistant&lt;/b&gt;&lt;/a&gt; zur Verfügung.&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Weitere Informationen&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;Weitere Informationen und Tipps bei kurzfristigen Unregelmässigkeiten sehen Sie auf &lt;a href=\&quot;https://www.lufthansa.com/de/de/flugunregelmaessigkeiten\&quot;&gt;&lt;b&gt;unserer Sonderseite&lt;/b&gt;&lt;/a&gt;.&lt;b&gt;&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;&lt;b&gt;Fluggastrechte&lt;/b&gt;&lt;/p&gt;\n&lt;p&gt;Hinweise zu den Fluggastrechten finden Sie &lt;a href=\&quot;https://www.lufthansa.com/de/de/passenger-rights?\&quot;&gt;&lt;b&gt;hier&lt;/b&gt;&lt;/a&gt;&lt;b&gt;&lt;br&gt;\n &lt;/b&gt;&lt;/p&gt;\n&quot;,&quot;link&quot;:&quot;/content/lh/markets/my/de/prepare-for-your-trip/current-travel-information&quot;,&quot;formattedActivationTime&quo
