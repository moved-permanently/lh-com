<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="./page-check.css">
  <script type="module" src="./page-check.js"></script>
</head>
<body>
  <header>
    <h1>Page check</h1>
    <button id="scan" type="button">Scan</button>
  </header>
  <p id="status" role="status">Loading …</p>
  <section id="scores" aria-label="Scores"></section>
  <ul id="issues" aria-label="Issues"></ul>
  <details>
    <summary>Checks</summary>
    <div id="checks"></div>
  </details>
</body>
</html>
