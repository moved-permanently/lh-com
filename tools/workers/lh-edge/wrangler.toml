name = "lh-edge"
main = "src/index.js"
compatibility_date = "2026-10-01"
# deploys to workers.dev; a demo host is attached in the Cloudflare dashboard (no routes or custom
# domains here, so the Worker moves to another account and zone unchanged)
workers_dev = true

# the Message Center JSON (/graphql/execute.json/Message-Center/*): the messages Worker
[[services]]
binding = "MESSAGES"
service = "lh-messages"

# lh-backends: www's server endpoints that are not pages (REST calls, deeplinks, Travel ID
# return and logout, seat map) and the synced Frontify brand assets under /content/dam
[[services]]
binding = "BACKENDS"
service = "lh-backends"

# AMS rest A6: lh-forms' bot check (RPC entrypoint BotCheck) for /service/secured/api/captcha/verify;
# the Turnstile secret stays in lh-forms
[[services]]
binding = "BOT_CHECK"
service = "lh-forms"
entrypoint = "BotCheck"

# Secret (optional, not here): ORIGIN_AUTHENTICATION, the site token when the origin needs one.

# publish events (src/events.js): the relay's position and the last 500 events, one key, written
# only when events arrive or the position moves (Workers Free: about 1,000 KV writes a day for
# the account). Secrets (not here): AUDIT_LOG_KEY (lh-com API key, author role: reads the audit
# log), WEBHOOK_TOKEN (the site config webhook's token), EVENTS_SINK_URL (optional: where each
# event is POSTed; unset, the relay logs what it would send).
[[kv_namespaces]]
binding = "EVENTS"
id = "d35891abf2ab4daa8dfa30dcec474628"

# Production mode's route switches (src/router.js), not bound here: create a namespace
# (npx wrangler kv namespace create ROUTER) and add
# [[kv_namespaces]]
# binding = "ROUTER"
# id = "<the namespace id>"

[vars]
# the audit log the publish events come from, and its org/site (checked on the webhook body)
EVENTS_LOG = "https://admin.hlx.page/log/moved-permanently/lh-com/main"
EVENTS_SITE = "moved-permanently/lh-com"
# the Edge Delivery origin (the reference Worker's ORIGIN_HOSTNAME)
ORIGIN = "main--lh-com--moved-permanently.aem.live"
# X-Forwarded-Host towards the origin: the public host of the site (empty: the request's host)
PUBLIC_HOST = ""
# the host whose <host>.solo_continue/ closes the app's web view, and www's page links in solo pages
WWW_HOST = "www.lufthansa.com"
# the alias sheet of the app's web view paths
ALIAS_SHEET = "/app/config/webview-aliases.json"
# app screens: web links as www sends them today ("external": showWebScreen externalBrowser /
# openUrl SELF to the www URL) or in the app's web view ("solo": AIR_EM, <page>.solo.continue)
SDUI_WEB_LINKS = "external"
# PUSH_INVALIDATION = "disabled"   # only for lower environments (more origin traffic)
# edge cache of origin answers in seconds (2xx; 404: 60 s), for hosts without push invalidation
# (the demo host); empty: the origin's max-age, as the reference (a zone with push invalidation)
EDGE_TTL = "60"
# version of lh-edge's edge cache (?lh-edge-cache=<value> on every cached origin request): a new
# value drops the cache (no custom cache keys or per-host purge on this plan); empty: not added
EDGE_CACHE_VERSION = "2026-10-25a"
# hosts that answer the pilot rows of the locale table (src/markets.js: ch/en, ch/de from their
# language's documents, their sitemaps, /ch entry redirects), the public host (X-LH-Public-Host,
# X-Forwarded-Host, PUBLIC_HOST, the request's host); elsewhere those paths pass through as before.
PILOT_HOSTS = "lufthansa-edge.turnsthe.page"
# hosts that show only some countries' pilot rows: "host=cc|cc; host2=cc" (the main host: ch; the
# China host: cn); empty: none
PILOT_COUNTRIES_BY_HOST = "lufthansa.turnsthe.page=ch; lufthansa-cn.turnsthe.page=cn"
# Production mode (src/router.js, README "Production mode"): all off here, every request routed as
# before. DEFAULT_ORIGIN: the host of paths no route claims ('' : Edge Delivery; production: the
# current origin, e.g. origin-www.lufthansa.com, then Edge Delivery answers only the configured
# paths); ROUTER_KILL "on": everything to the default origin; ROUTER_HEADER: a header naming the
# route on every answer (e.g. x-lh-edge-router); DEMO_HOSTS: public hosts whose answers get
# X-Robots-Tag: noindex (e.g. lufthansa.turnsthe.page,lufthansa-edge.turnsthe.page,
# lufthansa-cn.turnsthe.page), never the PRODUCTION_HOSTS (e.g. www.lufthansa.com). Route and path switches: the KV binding ROUTER, key
# "router" (no deploy), or ROUTER_CONFIG with the same JSON (a deploy).
DEFAULT_ORIGIN = ""
ROUTER_KILL = ""
ROUTER_HEADER = ""
DEMO_HOSTS = ""
PRODUCTION_HOSTS = ""
ROUTER_CONFIG = ""
# The referrer check of AEM's Sling filter on the POSTs lh-edge answers (src/referrer.js):
# REFERRER_FILTER "on" | "off"; REFERRER_ALLOW_HOSTS exact or *.domain, e.g. www.lufthansa.com,
# *.lufthansa.com,*.austrian.com,*.swiss.com,*.brusselsairlines.com,*.discover-airlines.com,
# *.ita-airways.com,*.lufthansagroup.com,*.ana.co.jp,*.airdolomiti.it,*.flyedelweiss.com;
# REFERRER_ALLOW_EMPTY "true" | "false". Off on every demo host.
REFERRER_FILTER = "off"
REFERRER_ALLOW_HOSTS = ""
REFERRER_ALLOW_EMPTY = "false"
# a production host to replace in head URLs (Edge Delivery writes the site config's production
# host into canonical, hreflang, og:* and twitter:* URLs): on the turnsthe.page brand hosts
# (scripts/demo.js) those head URLs then point at the host (src/head-urls.js; an alias host: its
# brand's main host). "": no rewrite (the production host is lufthansa.turnsthe.page itself)
HEAD_URLS_FROM = ""
# hosts where lh-edge is the front door (src/front-door.js, its own rules for the main host: the
# gate's paths to lh-backends, lh-edge's paths to the routes, everything else to the origin)
FRONT_DOOR_HOSTS = "lufthansa.turnsthe.page"
# alias hosts (src/alias.js; www.lufthansa.cn for www.lufthansa.com): routed like the main host;
# on their HTML, absolute links to the replica's own hosts (ALIAS_REWRITE_HOSTS) point at the alias
# host (canonical and hreflang links stay), Cache-Control as ALIAS_HTML_CACHE_CONTROL
ALIAS_HOSTS = "lufthansa-cn.turnsthe.page"
# the alias hosts' home (www's China host answers / with /cn/en/homepage): / goes to
# /<root>/homepage once the root is in the locale table (cn/en comes with its rollout batch; with
# a pilot row the China hosts serve it through PILOT_COUNTRIES_BY_HOST cn); until then / by country
ALIAS_HOME_ROOT = "cn/en"
# other spellings of a page URL (src/url-forms.js: upper case, .html, .nocache.html, a trailing
# slash, the long /content/lh/markets/<cc>/<ll>/ path): one 301 to the page; "off": as before
URL_FORMS = "on"
# other sites on lh-com's code (src/sites.js): SITE_HOSTS "host=site; ..." answers a host for that
# site (its locale table, its market roots from its language documents), SITE_ORIGINS
# "site=main--<repo>--<owner>.aem.live" its origin, SITE_WWW_HOSTS "site=www.example.com" the host
# its links name on the source site; "": none (every host as before). discover.turnsthe.page:
# Discover Airlines (DA moved-permanently/lh-discover, brief 124); ita.turnsthe.page: ITA Airways
# (DA moved-permanently/lh-ita, brief 158); cargo.turnsthe.page: Lufthansa Cargo (lh-cargo) and
# airdolomiti.turnsthe.page: Air Dolomiti (lh-airdolomiti), sites without roots (PLAIN_SITES,
# brief 162); rollback: a site's entries out of the vars
SITE_HOSTS = "discover.turnsthe.page=discover; ita.turnsthe.page=ita; cargo.turnsthe.page=cargo; airdolomiti.turnsthe.page=airdolomiti"
SITE_ORIGINS = "discover=main--lh-discover--moved-permanently.aem.live; ita=main--lh-ita--moved-permanently.aem.live; cargo=main--lh-cargo--moved-permanently.aem.live; airdolomiti=main--lh-airdolomiti--moved-permanently.aem.live"
SITE_WWW_HOSTS = "discover=www.discover-airlines.com; ita=www.ita-airways.com; cargo=www.lufthansa-cargo.com; airdolomiti=www.airdolomiti.it"
# where a site's /digitalhangar/ (www's design-system files, the brand fonts) comes from; Cargo uses
# Lufthansa's (www.lufthansa-cargo.com doesn't serve them); a site without one: its origin's answer
SITE_DESIGN_HOSTS = "discover=www.discover-airlines.com; ita=www.ita-airways.com; cargo=www.lufthansa.com"
# www's large DAM files (mp4 over 36 MB, vtt, PDFs over 20 MB) from this AEM publish tier, the only
# source of them (src/dam-aem.js); "": off. AEM_KEEPALIVE_URLS: one GET each an hour from the
# poller (src/aem-keepalive.js) so the sandbox doesn't hibernate; "": none
# ALIAS_REWRITE_HOSTS: the replica's hosts whose absolute links in content point at the alias host
# (old bbird.live hosts kept: an old link to them still moves to the alias host)
AEM_PUBLISH = "https://publish-p197609-e2272116.adobeaemcloud.com"
AEM_KEEPALIVE_URLS = "https://author-p197609-e2272116.adobeaemcloud.com/libs/granite/core/content/login.html,https://publish-p197609-e2272116.adobeaemcloud.com/content/dam/lh-com-poc/keepalive.png"
ALIAS_REWRITE_HOSTS = "lhcom.bbird.live,lhedge.bbird.live,lufthansa.turnsthe.page,lufthansa-edge.turnsthe.page"
ALIAS_HTML_CACHE_CONTROL = "public, max-age=28800"
# GraphQL feeds (/graphql/execute.json/...): origins that get CORS (host patterns: a domain is the
# domain and its subdomains, * one label, localhost any port; https only except localhost)
CORS_ORIGINS = "lufthansa.com,swiss.com,austrian.com,brusselsairlines.com,discover-airlines.com,ita-airways.com,lufthansagroup.com,miles-and-more.com,partnerplusbenefit.com,dlh.de,*--lh-com--moved-permanently.aem.page,*--lh-com--moved-permanently.aem.live,localhost"
