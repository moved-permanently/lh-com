name = "lh-forms"
main = "src/index.js"
compatibility_date = "2026-10-01"
# also on https://lh-forms.aem-poc-lab.workers.dev; the public address https://lhforms.bbird.live is a
# custom domain attached in the Cloudflare dashboard (no routes here: the deploy token cannot
# manage that zone)
workers_dev = true

# Secrets (not here): FORM_SENDER (from address), FORM_CONFIG (JSON, see README.md and
# FORM_CONFIG.example.json), FORM_MAIL_ACCOUNT_ID and FORM_MAIL_TOKEN (the Cloudflare account and
# API token of the Email Sending REST API; another account than this worker's),
# FORMS_DELIVERY_TOKEN (the token lh-backends expects in x-forms-delivery-token, for
# FORM_DELIVERY email+backends or backends), TURNSTILE_SECRET (the bot check). Set them with
# `npx wrangler@4 secret put <NAME>`; never log them.

# lh-backends: delivers submissions to the airline's systems (FORM_DELIVERY below)
[[services]]
binding = "DELIVERY"
service = "lh-backends"

[vars]
# email (default): the e-mail only; email+backends: the e-mail, then also lh-backends;
# backends: lh-backends instead of the e-mail. Switched by Ben once DELIVERY and
# FORMS_DELIVERY_TOKEN are in place; keep "email" here.
FORM_DELIVERY = "email"
ALLOWED_ORIGIN_PATTERN = "^https://[a-z0-9-]+--(lh-com|lh-flynet)--moved-permanently\\.(aem\\.(page|live)|(stage-)?(preview|ue)\\.da\\.(live|page))$"
EXTRA_ALLOWED_ORIGINS = "https://lhcom.bbird.live,http://localhost:3000"
# Bot check (AMS rest A6): Cloudflare Turnstile widget "lh-com forms (lh-forms)" (managed mode;
# hosts main--lh-com--moved-permanently.aem.page/.aem.live and lhcom.bbird.live only). The site
# key is public; the secret TURNSTILE_SECRET is set in the dashboard. BOT_CHECK on: /submit
# needs a valid token; off: no check (www has it off).
TURNSTILE_SITE_KEY = "0x4AAAAAAFnIbr4JnmqxGNVc"
BOT_CHECK = "on"

# 5 submissions per minute per client IP (the binding only supports periods of 10 or 60 s).
[[ratelimits]]
name = "RATE_LIMIT_MINUTE"
namespace_id = "4101"

  [ratelimits.simple]
  limit = 5
  period = 60

# 20 submissions per hour per client IP: one SQLite-backed Durable Object per IP.
[[durable_objects.bindings]]
name = "HOURLY_LIMITER"
class_name = "HourlyLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HourlyLimiter"]
