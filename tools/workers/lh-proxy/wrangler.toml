name = "lh-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The deployer adds account_id and routes. Note: the Cache API is a no-op on
# *.workers.dev hosts; use a custom domain for caching to take effect.
# routes = [
#   { pattern = "lh-proxy.example.com", custom_domain = true },
# ]

[vars]
UPSTREAM_ORIGIN = "https://www.lufthansa.com"
ALLOWED_ORIGIN_PATTERN = "^https://[a-z0-9-]+--(lh-com|lh-flynet)--moved-permanently\\.(aem\\.(page|live)|(stage-)?(preview|ue)\\.da\\.(live|page))$"
EXTRA_ALLOWED_ORIGINS = "http://localhost:3000"
CACHE_TTL = "300"
# UPSTREAM_TIMEOUT_MS = "8000"
