name: Deploy lh-msm
# Deploys the DA multi-site worker (da-sites/da-msm, pinned) as lh-msm, the content source of
# sites that inherit their pages from lh-com. The worker code is checked out, not copied here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-lh-msm.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-lh-msm
  cancel-in-progress: false

jobs:
  # One Cloudflare account (tools/workers/README.md "Account"): CLOUDFLARE_API_TOKEN_BENPETER,
  # vars.CLOUDFLARE_ACCOUNT_ID_BENPETER; lh-msm.benpeter.workers.dev, no account-specific ids.
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BENPETER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID_BENPETER }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: da-sites/da-msm
        ref: cf72b9b95b236e314168eefff0a9fa21e5f8c8ba
        path: da-msm
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Check Cloudflare credentials
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::Set the secret CLOUDFLARE_API_TOKEN_BENPETER (Workers Scripts:Edit on the account) and the variable CLOUDFLARE_ACCOUNT_ID_BENPETER."
          exit 1
        fi
    - name: Deploy
      working-directory: da-msm
      run: npx -y wrangler@4 deploy --name lh-msm
