name: Deploy lh-msm
# Deploys the DA multi-site worker (da-sites/da-msm, pinned) as lh-msm, the content source of
# sites that inherit their pages from lh-com. The worker code is checked out, not copied here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-lh-msm.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-lh-msm
  cancel-in-progress: false

jobs:
  # The parallel run (tools/workers/README.md "Two accounts"): every deploy goes to both Cloudflare
  # accounts, the Blackbird one as before and the second one (lh-msm.benpeter.workers.dev). No
  # account-specific ids (da-msm's wrangler.toml has vars only). Drop the blackbird row when
  # Blackbird is retired.
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: blackbird
            token: CLOUDFLARE_API_TOKEN
            account_id: ac7ee4615628005dc5ba0a22f0aae2a6
          - account: benpeter
            token: CLOUDFLARE_API_TOKEN_BENPETER
            account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID_BENPETER }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets[matrix.token] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ matrix.account_id }}
    steps:
    - uses: actions/checkout@v7
      with:
        repository: da-sites/da-msm
        ref: cf72b9b95b236e314168eefff0a9fa21e5f8c8ba
        path: da-msm
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Check Cloudflare credentials
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::Set the secret ${{ matrix.token }} (Workers Scripts:Edit on the ${{ matrix.account }} account) and, for the second account, the variable CLOUDFLARE_ACCOUNT_ID_BENPETER."
          exit 1
        fi
    - name: Deploy
      working-directory: da-msm
      run: npx -y wrangler@4 deploy --name lh-msm
