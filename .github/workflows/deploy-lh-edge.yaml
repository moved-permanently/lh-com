name: Deploy lh-edge
on:
  push:
    branches: [main]
    paths:
      - 'tools/workers/lh-edge/**'
      # but not the smoke baselines (answers recorded after a deploy, no code)
      - '!tools/workers/lh-edge/smoke/**'
      # the DAM names lh-edge shares with the site
      - 'scripts/dam-path.js'
      - 'scripts/dam-collisions.js'
      # and the site search scoring
      - 'scripts/site-search.js'
      # and the locales (the country and language selector, AMS rest A4), with the languages of the
      # brand sites without roots they read
      - 'scripts/locale.js'
      - 'scripts/site-languages.js'
      # and the locale table it bundles (generated from tools/markets/locale-data.json: a row
      # from pilot to live, a new root) and the market rules (section markets, served locale)
      - 'scripts/locale-table.js'
      - 'tools/markets/locale-data.json'
      - 'scripts/market-rules.js'
      # and the article helpers (web pages as SDUI: date line, related articles)
      - 'scripts/articles.js'
      # and the turnsthe.page brand list (the head-URL rewrite)
      - 'scripts/demo.js'
      # and the brands' favicons and manifests (src/brand-icons.js)
      - 'scripts/brand.js'
      # and the bound Workers' check (tools/workers/README.md "Account")
      - 'tools/workers/wait-for-workers.sh'
      - '.github/workflows/deploy-lh-edge.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-lh-edge
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/lh-edge
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm test

  # One Cloudflare account (tools/workers/README.md "Account"): CLOUDFLARE_API_TOKEN_BENPETER,
  # vars.CLOUDFLARE_ACCOUNT_ID_BENPETER, the turnsthe.page hosts; wrangler.toml as is.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/lh-edge
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BENPETER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID_BENPETER }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Check Cloudflare credentials
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::Set the secret CLOUDFLARE_API_TOKEN_BENPETER (Workers Scripts:Edit on the account) and the variable CLOUDFLARE_ACCOUNT_ID_BENPETER."
          exit 1
        fi
    # the Workers it binds must exist in the account (a first deploy to an empty account: lh-messages
    # deploys itself without its lh-edge binding first, then again once lh-edge is there)
    - name: Bound Workers in the account
      run: bash ../wait-for-workers.sh lh-backends lh-forms lh-messages
    - run: npx -y wrangler@4 deploy
