name: Deploy lh-edge
on:
  push:
    branches: [main]
    paths:
      - 'tools/workers/lh-edge/**'
      # the DAM names lh-edge shares with the site
      - 'scripts/dam-path.js'
      - 'scripts/dam-collisions.js'
      # and the site search scoring
      - 'scripts/site-search.js'
      # and the locales (the country and language selector, AMS rest A4)
      - 'scripts/locale.js'
      # and the article helpers (web pages as SDUI: date line, related articles)
      - 'scripts/articles.js'
      - '.github/workflows/deploy-lh-edge.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-lh-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/lh-edge
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ac7ee4615628005dc5ba0a22f0aae2a6
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm test
    - name: Check Cloudflare credentials
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set. It needs Workers Scripts:Edit on the Blackbird account."
          exit 1
        fi
    - run: npx -y wrangler@4 deploy
