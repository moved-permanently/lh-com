name: Deploy lh-proxy
on:
  push:
    branches: [main]
    paths:
      - 'tools/workers/lh-proxy/**'
      - '.github/workflows/deploy-lh-proxy.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-lh-proxy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/lh-proxy
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm test

  # One Cloudflare account (tools/workers/README.md "Account"): CLOUDFLARE_API_TOKEN_BENPETER,
  # vars.CLOUDFLARE_ACCOUNT_ID_BENPETER; lh-proxy.benpeter.workers.dev, no account-specific ids.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/lh-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BENPETER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID_BENPETER }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Check Cloudflare credentials
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::Set the secret CLOUDFLARE_API_TOKEN_BENPETER (Workers Scripts:Edit on the account) and the variable CLOUDFLARE_ACCOUNT_ID_BENPETER."
          exit 1
        fi
    - run: npx -y wrangler@4 deploy
