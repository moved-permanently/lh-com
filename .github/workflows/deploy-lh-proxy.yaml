name: Deploy lh-proxy
on:
  push:
    branches: [main]
    paths:
      - 'tools/workers/lh-proxy/**'
      - '.github/workflows/deploy-lh-proxy.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-lh-proxy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/lh-proxy
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm test

  # The parallel run (tools/workers/README.md "Two accounts"): every deploy goes to both Cloudflare
  # accounts, the Blackbird one as before and the second one (lh-proxy.benpeter.workers.dev). No
  # account-specific ids (no resources or bindings). Drop the blackbird row when Blackbird is retired.
  deploy:
    # the job's name shows the account only (the matrix values would show its id)
    name: deploy (${{ matrix.account }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: blackbird
            token: CLOUDFLARE_API_TOKEN
            account_id: ac7ee4615628005dc5ba0a22f0aae2a6
          - account: benpeter
            token: CLOUDFLARE_API_TOKEN_BENPETER
            account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID_BENPETER }}
    defaults:
      run:
        working-directory: tools/workers/lh-proxy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets[matrix.token] }}
      CLOUDFLARE_ACCOUNT_ID: ${{ matrix.account_id }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Check Cloudflare credentials
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::Set the secret ${{ matrix.token }} (Workers Scripts:Edit on the ${{ matrix.account }} account) and, for the second account, the variable CLOUDFLARE_ACCOUNT_ID_BENPETER."
          exit 1
        fi
    - run: npx -y wrangler@4 deploy
