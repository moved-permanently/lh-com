name: Deploy lh-messages
on:
  push:
    branches: [main]
    paths:
      - 'tools/workers/lh-messages/**'
      # and the bound Workers' check (tools/workers/README.md "Account")
      - 'tools/workers/wait-for-workers.sh'
      - '.github/workflows/deploy-lh-messages.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-lh-messages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/lh-messages
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm test

  # One Cloudflare account (tools/workers/README.md "Account"): CLOUDFLARE_API_TOKEN_BENPETER,
  # vars.CLOUDFLARE_ACCOUNT_ID_BENPETER, the turnsthe.page hosts; wrangler.toml as is.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/workers/lh-messages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BENPETER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID_BENPETER }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Check Cloudflare credentials
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "::error::Set the secret CLOUDFLARE_API_TOKEN_BENPETER (Workers Scripts:Edit on the account) and the variable CLOUDFLARE_ACCOUNT_ID_BENPETER."
          exit 1
        fi
    # lh-messages and lh-edge bind each other (EVENTS_RELAY here, MESSAGES there). On a first
    # deploy to an empty account lh-edge is not there yet: when Cloudflare refuses the binding,
    # lh-messages goes out without EVENTS_RELAY (the code skips the relay without it), lh-edge's
    # deploy (which waits for lh-messages) follows, and lh-messages goes out again with the binding.
    - name: Deploy
      run: |
        set -o pipefail
        if npx -y wrangler@4 deploy 2>&1 | tee /tmp/deploy.log; then exit 0; fi
        if bash ../wait-for-workers.sh --check lh-edge; then exit 1; fi
        # only a refused binding (any other error stays an error)
        if ! grep -qiE "binding|lh-edge|EventsRelay" /tmp/deploy.log; then exit 1; fi
        echo "::warning::lh-edge is not in the account yet: lh-messages without EVENTS_RELAY first, then again once lh-edge is there"
        sed '/^\[\[services\]\]$/,/^entrypoint = "EventsRelay"$/d' wrangler.toml > wrangler.bootstrap.gen.toml
        if grep -q EVENTS_RELAY wrangler.bootstrap.gen.toml; then echo "::error::EVENTS_RELAY still in the bootstrap config"; exit 1; fi
        npx -y wrangler@4 deploy -c wrangler.bootstrap.gen.toml
        bash ../wait-for-workers.sh lh-edge
        npx -y wrangler@4 deploy
