      - /pl/pl/support/search/**
      - /pl/pl/articles/config/**
    target: /pl/pl/search-index.json
    properties:
      title:
        select: head > title
        value: textContent(el)
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https:\/\/[^/]+(/.*)")
      headings:
        select: main h1, main h2, main h3
        values: textContent(el)
      content:
        select: main p, main li, main div > a
        values: textContent(el)
      parent:
        select: head > meta[name="parent"]
        value: attribute(el, "content")
      hide-in-search:
        select: head > meta[name="hide-in-search"]
        value: attribute(el, "content")
      # the XML sitemaps (helix-sitemap.yaml, AMS rest A7): the de/en page a translated slug
      # pairs with, and the page's OWN robots value: page-robots, which the site-wide
      # /metadata.json row (noindex on every page until go-live) does not set;
      # meta[name="robots"] would carry that inherited noindex and empty every sitemap. No
      # canonical column: Edge Delivery fills it with the production host, and the sitemap
      # builder drops every row whose canonical differs from origin plus path
      primary-language-url:
        select: head > meta[name="primary-language-url"]
        value: attribute(el, "content")
      robots:
        select: head > meta[name="page-robots"]
        value: attribute(el, "content")
      # llms.txt (AMS rest A8, AUTHORING.md): which pages lh-edge lists in /<cc>/llms.txt and
      # how; ai-guidance on the locale's homepage
      llms-include:
        select: head > meta[name="llms-include"]
        value: attribute(el, "content")
      llms-title:
        select: head > meta[name="llms-title"]
        value: attribute(el, "content")
      llms-description:
        select: head > meta[name="llms-description"]
        value: attribute(el, "content")
      llms-category:
        select: head > meta[name="llms-category"]
        value: attribute(el, "content")
      ai-guidance:
        select: head > meta[name="ai-guidance"]
        value: attribute(el, "content")
      # Market roots (lh-edge src/markets.js): the countries of the language whose market roots
      # get this page from its language version (include "de, at", exclude "-ch, -us"; empty:
      # all). tools/markets/seed-markets.mjs seeded it; authors keep it in DA (AUTHORING.md)
