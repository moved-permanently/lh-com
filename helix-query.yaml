  # Site search (package 7): one index per locale, read by the search-results block and by
  # lh-edge's POST /service/secured/api/search (scripts/site-search.js scores both). headings
  # and content are lists (values); content is the running text (paragraphs, list items and
  # links alone in a block cell), not the block configuration cells. (A function around
  # textContent in `values` joins the list into one value: words(...) kept only the first 40
  # words of the page, so the text is indexed whole.) Pages with the metadata
  # hide-in-search: true stay in the index and are left out by the block and lh-edge.
  search-de-en:
    include:
      - /de/en/**
    exclude:
      - /de/en/nav
      - /de/en/footer
      - /de/en/fragments/**
      - /de/en/drafts/**
      - /de/en/**/confirmation
      - /de/en/**/*-confirmation
      - /de/en/support/search/**
      - /de/en/articles/config/**
    target: /de/en/search-index.json
    properties:
      title:
        select: head > title
        value: textContent(el)
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, "content"), "https:\/\/[^/]+(/.*)")
      headings:
        select: main h1, main h2, main h3
        values: textContent(el)
      content:
        select: main p, main li, main div > a
        values: textContent(el)
      parent:
        select: head > meta[name="parent"]
        value: attribute(el, "content")
      hide-in-search:
        select: head > meta[name="hide-in-search"]
        value: attribute(el, "content")
      # the XML sitemaps (helix-sitemap.yaml, AMS rest A7): the page's canonical link, the
      # de/en page a translated slug pairs with, and the page's OWN robots value: page-robots,
      # which the site-wide /metadata.json row (noindex on every page until go-live) does not
      # set; meta[name="robots"] would carry that inherited noindex and empty every sitemap
      canonical:
        select: head > link[rel="canonical"]
        value: attribute(el, "href")
      primary-language-url:
        select: head > meta[name="primary-language-url"]
        value: attribute(el, "content")
      robots:
        select: head > meta[name="page-robots"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")

