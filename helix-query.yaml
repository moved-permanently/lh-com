version: 1

# Query indexes of lh-com. Add new indexes below; don't replace this file.

indices:
  # Message Center: one row per message and language, from the structured
  # content documents /message-center/<type>/<id>/<lang> (schema lh-message).
  # Selectors are anchored on the field keys, see
  # https://www.aem.live/docs/ew/administering/structured-content
  # List fields (tenants, markets, touchpoints) use `values`; check
  # /message-center/index.json for how the index stores them.
  message-center:
    include:
      - /message-center/irreg/**
      - /message-center/tech-outage/**
      - /message-center/promo/**
    exclude:
      - /message-center/details/**
      - /message-center/config/**
    target: /message-center/index.json
    properties:
      headline:
        select: div > div > div:has(#headline) > div:last-child
        value: textContent(el)
      criticality:
        select: div > div > div:has(#criticality) > div:last-child
        value: textContent(el)
      tenants:
        select: div > div > div:has(#tenants) > div:last-child li
        values: textContent(el)
      markets:
        select: div > div > div:has(#markets) > div:last-child li
        values: textContent(el)
      touchpoints:
        select: div > div > div:has(#touchpoints) > div:last-child li
        values: textContent(el)
      link:
        select: div > div > div:has(#link) > div:last-child
        value: textContent(el)
      details:
        select: div > div > div:has(#details) > div:last-child
        value: textContent(el)
      from:
        select: div > div > div:has(#from) > div:last-child
        value: textContent(el)
      to:
        select: div > div > div:has(#to) > div:last-child
        value: textContent(el)
      push:
        select: div > div > div:has(#push) > div:last-child
        value: textContent(el)
      internal-title:
        select: div > div > div:has(#internal-title) > div:last-child
        value: textContent(el)
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")

  # Lufthansa app screens (server-driven UI): one row per screen document under
  # /content/mobile/lh/<lang>/ (hub, categories, articles, homepage). lh-edge renders the
  # .sdui / .v2.sdui answers from the documents and fills the category screens' article lists
  # from this index (category, date, order); the titles of linked screens come from it too.
  app-screens:
    include:
      - /content/mobile/lh/**
    target: /content/mobile/lh/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, "content")
      headline:
        select: main h1
        value: textContent(el)
      description:
        select: head > meta[name="description"]
        value: attribute(el, "content")
      image:
        select: head > meta[name="teaser-image"]
        value: attribute(el, "content")
      category:
        select: head > meta[name="category"]
        value: attribute(el, "content")
      date:
        select: head > meta[name="date"]
        value: attribute(el, "content")
      order:
        select: head > meta[name="order"]
        value: attribute(el, "content")
      lastModified:
        select: none
        value: parseTimestamp(headers["last-modified"], "ddd, DD MMM YYYY hh:mm:ss GMT")

  # Lufthansa Insights articles, one index per locale, articles only: the overview, tag and
  # author pages are excluded by path (and only articles have page-type "article", which the
  # blocks check too). Read by blog-overview (category, tag and author overviews),
  # related-articles and the author slider (carousel-cards authors). tags: the tag titles (EDS
  # writes the Tags metadata as article:tag); tag-ids: www's ids ("articles:munich");
  # title, description, image: the article's h1, intro and feature image, which www's list cards
  # show (not og:title, the meta description or og:image).
  articles-de-en:
    include:
      - /de/en/articles/*/*
    exclude:
      - /de/en/articles/tags/**
      - /de/en/articles/authors/**
      - /de/en/articles/config/**
      # a campaign page (template content on www), not an article
      - /de/en/articles/highlights/all-it-takes-is-a-yes
      # a campaign page as well (de/en, de/de): not in www's article list
      - /de/en/articles/highlights/soccer-event-in-north-america
    target: /de/en/articles/query-index.json
    properties:
      title:
        select: main .article-header h1
        value: textContent(el)
      description:
        select: main .article-header h1 + p
        value: textContent(el)
      image:
        select: head > meta[name="card-image"]
        value: match(attribute(el, "content"), "https:\/\/[^/]+(/.*)")
      image-alt:
        select: head > meta[name="card-image-alt"]
        value: attribute(el, "content")
      page-type:
        select: head > meta[name="page-type"]
        value: attribute(el, "content")
      category:
