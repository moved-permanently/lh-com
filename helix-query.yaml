      - /it/en/**
      - /it/it/**
      - /fr/fr/**
      - /es/es/**
      - /nl/nl/**
      - /br/pt/**
      - /gr/el/**
      - /jp/ja/**
      # lh-austrian's language versions (tools/workers/lh-edge/src/sites.js; at/de as above, at/en
      # is lh-com's market root and stays); lh-com has no documents under these roots
      - /ru/ru/**
      - /cn/zh/**
      - /pl/pl/**
      - /content/**
      - /data/**
      - /drafts/**
      - /lhg/**
      - /library/**
      - /xf/**
      - /app/**
      - /message-center/**
      - /media-da/**
      - /*/*/nav
      - /*/*/footer
      - /*/*/fragments/**
      - /*/*/drafts/**
