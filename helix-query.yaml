  # GraphQL data feeds (lh-edge answers /graphql/execute.json/<config>/<query> from these):
  # one index per DA structured content model under /data/ (schemas in /.da/forms/schemas/,
  # tools/feeds/schemas.mjs). The fields are the documents' fields; html is the document
  # (main) as EDS renders it, which lh-edge reads (nested values, exact types). Each index
  # JSON is a plain feed of its own (tools/workers/lh-edge/README.md "Data feeds").
  # What's new of the Lufthansa app (mobileapp/whatsnewList and the pop-up queries)
  feed-whatsnew:
    include:
      - /data/lufthansa-group/mobileapp/whats-new/**
    target: /data/lufthansa-group/mobileapp/whats-new/query-index.json
