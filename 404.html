<!DOCTYPE html>
<html>
<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found | Lufthansa</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found | Lufthansa">
  <!-- text and links in the language of the path (live's not-found page per market), on a brand
       site the brand of its /metadata.json first; not-found.js then loads scripts.js, which
       decorates main like any page -->
  <script nonce="aem" src="/scripts/not-found.js" type="module"></script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    /* live .error-page (1440): h1 heading-xl, search field 340px wide with a 2px bottom border
       (as the footer search), the links one below the other */
    main .not-found-search {
      position: relative;
      display: flex;
      align-items: center;
      max-width: 340px;
      margin: 0 0 40px;
      border-bottom: 2px solid var(--lh-deepblue);
    }

    main .not-found-search input {
      flex: 1 1 auto;
      min-width: 0;
      height: 39px;
      padding: 6px 32px 6px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--lh-deepblue);
      font-family: inherit;
      font-size: 18px;
      appearance: none;
    }

    main .not-found-search button {
      position: absolute;
      top: 6px;
      right: 0;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
    }

    main .not-found-sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>
<body>
  <header></header>
  <main>
    <div>
      <h1>Page not found</h1>
      <p><a href="/de/de/homepage">Zur Startseite</a></p>
    </div>
  </main>
  <footer></footer>
</body>
</html>
